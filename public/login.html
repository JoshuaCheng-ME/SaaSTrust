<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaSTrust — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md px-6">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">SaaSTrust.net</h1>
      <p class="text-slate-500 mt-1">Authentic B2B Reviews Platform</p>
    </div>
    <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 p-8">
      <h2 class="text-xl font-bold text-slate-900 mb-6">Welcome Back</h2>

      <div id="errorBox" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg"></div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Email</label>
          <input type="email" id="email" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-black focus:border-transparent" placeholder="your@email.com" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
          <input type="password" id="password" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-black focus:border-transparent" placeholder="········" required>
        </div>
        <button type="submit" class="w-full py-3 bg-black text-white font-semibold rounded-xl hover:bg-gray-800 transition-all shadow-lg">Sign In</button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-slate-500 text-sm">Don't have an account? <a href="/register.html" class="text-black hover:text-gray-600 font-medium">Sign up</a></p>
      </div>
    </div>
  </div>

  <script>
    const loginParams = new URLSearchParams(window.location.search);
    const loginPack = loginParams.get('pack');

    const errorBox = document.getElementById('errorBox');

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const r = await fetch('/api/auth/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email, password})
      });

      const data = await r.json();

      if (r.ok) {
        switch(data.role) {
          case 'employer':
            window.location.href = loginPack ? `/client.html?pack=${loginPack}` : '/client.html';
            break;
          case 'reviewer': window.location.href = '/tester.html'; break;
          case 'admin': window.location.href = '/admin.html'; break;
        }
      } else {
        errorBox.textContent = data.error || 'Login failed';
        errorBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
