<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaSTrust - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md px-6">
    <!-- Logo -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-900">SaaSTrust.net</h1>
      <p class="text-slate-500 mt-2">Authentic B2B Reviews Platform</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 p-8">
      <h2 class="text-xl font-bold text-slate-900 mb-6">Welcome Back</h2>
      
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Email</label>
          <input 
            type="email" 
            id="email"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            placeholder="your@email.com"
            required
          />
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
          <input 
            type="password" 
            id="password"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            placeholder="••••••••"
            required
          />
        </div>
        
        <button 
          type="submit"
          class="w-full py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-500/20"
        >
          Sign In
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-slate-500 text-sm">
          Don't have an account? 
          <a href="/register.html" class="text-blue-600 hover:text-blue-700 font-medium">Sign up</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      
      const data = await response.json();
      
      if (response.ok) {
        // Redirect based on role
        if (data.role === 'client') {
          window.location.href = '/client.html';
        } else if (data.role === 'tester') {
          window.location.href = '/tester.html';
        } else if (data.role === 'admin') {
          window.location.href = '/admin.html';
        }
      } else {
        alert(data.error);
      }
    });
  </script>
</body>
</html>
