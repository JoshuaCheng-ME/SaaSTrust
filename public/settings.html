<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings · SaaSTrust.net</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111'/><text x='50' y='68' text-anchor='middle' font-family='Arial,sans-serif' font-weight='bold' font-size='48' fill='white'>ST</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">

  <!-- Top Bar -->
  <nav class="sticky top-0 z-50 backdrop-blur-md bg-white/70 border-b border-slate-100/50">
    <div class="max-w-2xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="text-lg font-bold text-slate-900">SaaSTrust.net</a>
      <span id="userRole" class="text-sm text-slate-500"></span>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-6 py-12">
    <!-- Back link -->
    <a id="backLink" href="/client.html" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-900 mb-8 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      Back to Dashboard
    </a>

    <h1 class="text-2xl font-bold text-slate-900 mb-8">Settings</h1>

    <!-- Message area -->
    <div id="msgBox" class="hidden mb-6 px-4 py-3 rounded-xl text-sm font-medium"></div>

    <!-- Settings Form -->
    <form id="settingsForm" class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 p-8 space-y-6">
      <div class="flex flex-col items-center py-12 text-slate-400">
        <svg id="settingsLoadingSpinner" class="animate-spin w-8 h-8 mb-4 text-slate-300" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p id="settingsLoadingText" class="text-sm">Loading settings...</p>
      </div>
    </form>

    <div class="mt-6 text-center">
      <a href="/login.html" onclick="return logout();" class="text-sm text-red-500 hover:text-red-600 transition-colors">Logout</a>
    </div>
  </main>

  <script>
    let currentUser = null;

    function field(label, id, type, value, disabled, extraClass) {
      const cls = disabled
        ? 'bg-slate-50 text-slate-500 cursor-not-allowed'
        : 'bg-white border-slate-200 focus:border-slate-900 focus:ring-1 focus:ring-slate-900';
      return `
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">${label} ${disabled ? '<span class="text-xs text-slate-400">(read-only)</span>' : ''}</label>
          <input type="${type}" id="${id}" value="${value||''}" ${disabled?'disabled':''}
            class="w-full px-4 py-2.5 border rounded-xl text-sm outline-none transition-all ${cls} ${extraClass||''}" />
        </div>`;
    }

    async function loadSettings() {
  try {
    // Step 1 — fast auth check (same as tester.html / client.html)
    const auth = await fetch('/api/auth/user');
    if (!auth.ok) {
      // 401 = not logged in → go to login
      if (auth.status === 401) { window.location.href = '/login.html'; return; }
      // Other errors = server down, show message
      showLoadError('Auth check failed (HTTP ' + auth.status + '). Please try refreshing the page.');
      return;
    }
    const user = await auth.json();

    // Step 2 — load full settings
    const r = await fetch('/api/user/settings');
    if (!r.ok) {
      if (r.status === 401) { window.location.href = '/login.html'; return; }
      const errText = await r.text().catch(() => '');
      let errMsg = 'HTTP ' + r.status;
      try { const j = JSON.parse(errText); errMsg = j.error || errMsg; } catch (_) {}
      showLoadError('Failed to load settings: ' + errMsg);
      return;
    }
    const d = await r.json();
    currentUser = d;

    document.getElementById('userRole').textContent = d.role === 'employer' ? 'Employer Settings' : 'Reviewer Settings';

    const form = document.getElementById('settingsForm');
    let html = '';

    if (d.role === 'employer') {
      document.getElementById('backLink').href = '/client.html';
      html += field('E-mail', 'email', 'email', d.email, true);
      html += field('Company Name', 'company_name', 'text', d.company_name, false);
      html += field('Contact Name', 'contact_name', 'text', d.contact_name, false);
    } else {
      document.getElementById('backLink').href = '/tester.html';
      html += field('LinkedIn URL', 'linkedin_url', 'text', d.linkedin_url, true);
      html += field('Industry', 'industry', 'text', d.industry, true);
      html += field('Payout E-mail (Amazon Gift Card)', 'payout_email', 'email', d.payout_email, false);
    }

    html += `
        <button type="submit" class="w-full py-3 bg-slate-900 text-white text-sm font-semibold rounded-xl hover:bg-slate-800 transition-all">
          Save Changes
        </button>`;
    form.innerHTML = html;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = 'Saving...';

      const body = {};
      if (currentUser.role === 'employer') {
        body.company_name = document.getElementById('company_name').value.trim();
        body.contact_name = document.getElementById('contact_name').value.trim();
      } else {
        body.payout_email = document.getElementById('payout_email').value.trim();
      }

      const r2 = await fetch('/api/user/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const msg = document.getElementById('msgBox');
      if (r2.ok) {
        msg.className = 'mb-6 px-4 py-3 rounded-xl text-sm font-medium bg-green-50 text-green-700 border border-green-200';
        msg.textContent = 'Settings saved successfully.';
      } else {
        const err = await r2.json();
        msg.className = 'mb-6 px-4 py-3 rounded-xl text-sm font-medium bg-red-50 text-red-700 border border-red-200';
        msg.textContent = err.error || 'Failed to save settings.';
      }
      msg.classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Save Changes';
    });
  } catch (e) {
    console.error('settings.loadSettings:', e);
    showLoadError('Network error. Please check your connection and try again.');
  }
}

function showLoadError(message) {
  const form = document.getElementById('settingsForm');
  form.innerHTML = `
    <div class="flex flex-col items-center py-12 text-center">
      <div class="w-12 h-12 mb-4 rounded-full bg-red-100 flex items-center justify-center">
        <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </div>
      <p class="text-sm text-red-600 mb-2">${message}</p>
      <button onclick="window.location.reload()" class="mt-4 px-5 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">Retry</button>
    </div>`;
}

function logout() {
  fetch('/api/auth/logout', { method: 'POST' });
}

    loadSettings();
  </script>
</body>
</html>
