<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaSTrust - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">
  <div class="w-full max-w-xl mx-auto px-6 py-8">
    <!-- Logo -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-900">SaaSTrust.net</h1>
      <p class="text-slate-500 mt-2">Authentic B2B Reviews Platform</p>
    </div>

    <!-- Register Card -->
    <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 p-8">
      <h2 class="text-xl font-bold text-slate-900 mb-6">Create Account</h2>
      
      <form id="registerForm" class="space-y-5">
        <!-- Role Selection -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Account Type</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-blue-500 transition-all">
              <input type="radio" name="role" value="employer" class="w-4 h-4 text-blue-600" required>
              <span class="ml-3 font-medium text-slate-700">I'm an Employer</span>
            </label>
            <label class="flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-blue-500 transition-all">
              <input type="radio" name="role" value="reviewer" class="w-4 h-4 text-blue-600" required>
              <span class="ml-3 font-medium text-slate-700">I'm a Reviewer</span>
            </label>
          </div>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Email</label>
          <input 
            type="email" 
            id="email"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            placeholder="your@email.com"
            required
          />
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
          <input 
            type="password" 
            id="password"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            placeholder="••••••••"
            required
          />
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Industry</label>
          <select 
            id="industry"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            required
          >
            <option value="">Select your industry</option>
            <option value="E-commerce">E-commerce</option>
            <option value="HR">HR / Human Resources</option>
            <option value="Marketing">Marketing</option>
            <option value="Development">Software Development</option>
            <option value="Finance">Finance / FinTech</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Education">Education / EdTech</option>
            <option value="Real Estate">Real Estate</option>
            <option value="SaaS">SaaS / B2B Software</option>
            <option value="Other">Other</option>
          </select>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">LinkedIn Profile URL <span class="text-red-500">*</span></label>
          <input 
            type="url" 
            id="linkedin_url"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            placeholder="https://linkedin.com/in/your-profile"
            required
          />
        </div>
        
        <button 
          type="submit"
          class="w-full py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-500/20"
        >
          Create Account
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-slate-500 text-sm">
          Already have an account? 
          <a href="/login.html" class="text-blue-600 hover:text-blue-700 font-medium">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.querySelector('input[name="role"]:checked').value;
      const industry = document.getElementById('industry').value;
      const linkedin_profile = document.getElementById('linkedin_url').value;
      
      const response = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role, industry, linkedin_profile })
      });
      
      const data = await response.json();
      
      if (response.ok) {
        alert('Registration successful! Please login.');
        window.location.href = '/login.html';
      } else {
        alert(data.error);
      }
    });
  </script>
</body>
</html>
